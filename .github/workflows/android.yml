name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The green zone. `core` is a separate Gradle build with no Android Gradle
  # Plugin, so this job needs no SDK and runs in seconds. It is also the only
  # job that can run in environments where Google's Maven is unreachable, which
  # is why the bulk of the app's logic is deliberately kept on this side of the
  # line — every engine, presenter and query is covered here.
  core:
    name: Core (logic + real SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # Compiles core, verifies the SQLDelight schema, and runs the whole suite
      # against an in-memory SQLite engine.
      - name: Core check
        run: ./gradlew -p core check --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

  # The blind zone: Compose and the Android glue have no local verification in
  # restricted environments, so this job is the compiler for that half.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # Compile as its own step, first. It is by far the most common failure and
      # it fails in a fraction of the time a full assemble takes — which matters
      # when this is the only feedback the UI layer gets.
      - name: Compile
        run: ./gradlew --no-daemon compileDebugKotlinAndroid

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Uploaded before lint runs: lint is slow, and a lint failure should not
      # cost you an APK that already built.
      - uses: actions/upload-artifact@v4
        with:
          name: workoutmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
